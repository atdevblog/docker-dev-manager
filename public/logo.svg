<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Docker Dev Manager">
  <title>Docker Dev Manager</title>
  <!-- Original mark: a stack of gold shipping containers over a monitoring pulse. Not the Docker whale. -->
  <defs>
    <linearGradient id="ddm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2436"/><stop offset="1" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="ddm-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7DC7A" stop-opacity=".8"/><stop offset=".5" stop-color="#D4AF37" stop-opacity=".35"/><stop offset="1" stop-color="#8C6A14" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="ddm-gold" gradientUnits="userSpaceOnUse" x1="14" y1="9" x2="50" y2="44">
      <stop offset="0" stop-color="#FFF3B0"/><stop offset=".3" stop-color="#F6D25C"/><stop offset=".62" stop-color="#D4AF37"/><stop offset="1" stop-color="#9A7414"/>
    </linearGradient>
    <linearGradient id="ddm-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8901F"/><stop offset=".5" stop-color="#FFE27A"/><stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="ddm-glow" cx=".5" cy=".46" r=".5">
      <stop offset="0" stop-color="#D4AF37" stop-opacity=".22"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#ddm-bg)" stroke="url(#ddm-rim)" stroke-width="1.5"/>
  <ellipse cx="32" cy="29" rx="27" ry="22" fill="url(#ddm-glow)"/>
  <g fill="url(#ddm-gold)">
    <rect x="26" y="10" width="12" height="9" rx="1.6"/>
    <rect x="19" y="21.5" width="12" height="9" rx="1.6"/><rect x="33" y="21.5" width="12" height="9" rx="1.6"/>
    <rect x="12" y="33" width="12" height="9" rx="1.6"/><rect x="26" y="33" width="12" height="9" rx="1.6"/><rect x="40" y="33" width="12" height="9" rx="1.6"/>
  </g>
  <!-- container ribs -->
  <g stroke="#6E500C" stroke-opacity=".5" stroke-width=".9" stroke-linecap="round">
    <path d="M30 12v5M34 12v5M23 23.5v5M27 23.5v5M37 23.5v5M41 23.5v5M16 35v5M20 35v5M30 35v5M34 35v5M44 35v5M48 35v5"/>
  </g>
  <!-- top-edge sheen -->
  <g stroke="#FFF8D6" stroke-opacity=".75" stroke-width=".7" stroke-linecap="round">
    <path d="M27.4 10.9h9.2M20.4 22.4h9.2M34.4 22.4h9.2M13.4 33.9h9.2M27.4 33.9h9.2M41.4 33.9h9.2"/>
  </g>
  <polyline points="12,51 24.5,51 28,46.5 32.5,55.5 36.5,48.5 39,51 49.5,51" fill="none" stroke="url(#ddm-pulse)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="51.5" cy="51" r="2.4" fill="#FFE58A"/>
  <circle cx="51.5" cy="51" r="4.2" fill="#FFD700" fill-opacity=".18"/>
</svg>
