<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 16 px cut, drawn on the pixel grid: 3x3 px containers, 1 px gaps. Only used inside favicon.ico. -->
  <rect x=".5" y=".5" width="15" height="15" rx="3" fill="#121A29" stroke="#D4AF37" stroke-opacity=".6" shape-rendering="geometricPrecision"/>
  <g fill="#F2C744">
    <rect x="7" y="2" width="3" height="3" fill="#FFE27A"/>
    <rect x="5" y="6" width="3" height="3" fill="#FAD45A"/><rect x="9" y="6" width="3" height="3"/>
    <rect x="3" y="10" width="3" height="3"/><rect x="7" y="10" width="3" height="3"/><rect x="11" y="10" width="3" height="3" fill="#D9A92A"/>
  </g>
</svg>
